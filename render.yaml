services:
  - type: web
    name: veritas-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app1:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: AUDIO_SERVICE_URL
        sync: false
      - key: IMAGE_SERVICE_URL
        sync: false
